[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vshift"
version = "0.1.0"
description = "Autonomous volunteer coordination agent for nonprofits"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "strands-agents>=1.0.0,<2.0.0",
    "strands-agents-tools>=0.2.0",
    "strands-agents[openai]>=1.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "openai>=2.0.0",
    "aws-bedrock-token-generator>=1.0.0",
    "bedrock-agentcore>=0.1.0",
    "aws-opentelemetry-distro>=0.1.0",
    "opentelemetry-instrumentation>=0.52b0",
    "opentelemetry-instrumentation-fastapi>=0.52b0",
    "opentelemetry-exporter-otlp-proto-http>=1.34.0",
]

[tool.setuptools.packages.find]
where = ["src"]
